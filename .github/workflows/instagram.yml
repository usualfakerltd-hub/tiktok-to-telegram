name: Instagram to Telegram

on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repost-ig
  cancel-in-progress: false

jobs:
  repost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Run Instagram bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          IG_ACCOUNTS: ${{ secrets.IG_ACCOUNTS }}
          MAX_AGE_DAYS: '7'
          IG_FETCH_LIMIT: '5'
        run: python instagram.py

      - name: Commit state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_instagram.json || true
          git diff --quiet --cached || git commit -m "update ig state [skip ci]"
          git pull --rebase --autostash
          git push

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.ALERT_CHAT }}" \
            --data-urlencode "text=⚠️ Instagram-бот упал. Лог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null
