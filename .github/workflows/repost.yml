name: TikTok to Telegram

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repost
  cancel-in-progress: false

jobs:
  repost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run TikTok bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          TIKTOK_USERS: ${{ secrets.TIKTOK_USERS }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python bot.py

      - name: Run YouTube bot
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          YT_CHANNELS: ${{ secrets.YT_CHANNELS }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          MAX_AGE_DAYS: '7'
          SHORTS_AS_VIDEO: '1'
          MAX_HEIGHT: '1080'
        run: python youtube.py

      - name: Commit state
        id: commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Алерт шлём только при ПЕРВОМ сбое подряд — чтобы долгий внешний
          # простой (например, у YouTube) не заваливал уведомлениями каждые
          # 15-30 минут. Как только прогон снова пройдёт успешно, счётчик
          # сбрасывается, и следующий же сбой (тот же самый или новый) снова
          # пришлёт алерт.
          PREV="ok"
          if [ -f alert_state.txt ]; then PREV=$(cat alert_state.txt); fi
          if [ "${{ job.status }}" == "failure" ]; then
            echo "fail" > alert_state.txt
            if [ "$PREV" == "fail" ]; then
              echo "should_alert=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_alert=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ok" > alert_state.txt
            echo "should_alert=false" >> "$GITHUB_OUTPUT"
          fi

          git add state.json state_youtube.json state_tiktok_checks.json alert_state.txt || true
          git diff --quiet --cached || git commit -m "update state [skip ci]"
          git pull --rebase --autostash
          git push

      - name: Notify on failure
        if: steps.commit.outputs.should_alert == 'true'
        run: |
          RESPONSE=$(curl -sS -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.ALERT_CHAT }}" \
            --data-urlencode "text=⚠️ Бот упал. Лог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          echo "Telegram ответил: $RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true' || echo "!!! отправка не удалась, смотри ответ выше"
